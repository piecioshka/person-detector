<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Detects people on a live video stream and draws bounding boxes around them" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Wykrywacz ludzi</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script>
      // Apply the theme before the first paint to avoid a flash.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('person-detector:theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
        // Hide the page until main.ts swaps the Polish markup texts for another language.
        var lang = null;
        try {
          lang = localStorage.getItem('person-detector:lang');
        } catch (e) {}
        if (lang !== 'pl' && lang !== 'en') {
          lang = navigator.language.toLowerCase().indexOf('pl') === 0 ? 'pl' : 'en';
        }
        if (lang !== 'pl') {
          document.documentElement.dataset.i18nPending = '';
        }
      })();
    </script>
  </head>
  <body>
    <header class="topbar">
      <h1 class="topbar__logo">
        <img src="/favicon.svg" alt="" width="24" height="24" />
        <span data-i18n="appName">Wykrywacz ludzi</span>
      </h1>
      <div class="topbar__actions">
        <button id="lang-toggle" class="icon-button" type="button" data-i18n-label="switchLanguage">
          <span id="lang-flag" aria-hidden="true">🇵🇱</span>
        </button>
        <button id="theme-toggle" class="icon-button" type="button" data-i18n-label="switchTheme">
          <svg class="icon icon--sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2m-7.07-17.07 1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"
            />
          </svg>
          <svg class="icon icon--moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
          </svg>
        </button>
        <a class="icon-button" href="https://github.com/piecioshka/person-detector" data-i18n-label="sourceCode">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"
            />
            <path d="M9 18c-4.51 2-5-2-7-2" />
          </svg>
        </a>
      </div>
    </header>

    <main class="layout">
      <form id="source-form" class="source">
        <label class="field field--grow">
          <span class="field__label" data-i18n="urlLabel">Adres filmu lub transmisji z YouTube</span>
          <input
            id="url-input"
            class="input"
            type="url"
            required
            value="https://www.youtube.com/watch?v=03pYP2Nmreo"
            autocomplete="off"
          />
        </label>
        <button id="play-button" class="button button--primary" type="submit" data-i18n="play" disabled>Odtwórz</button>
        <label class="button">
          <span data-i18n="localFile">Plik z dysku</span>
          <input id="file-input" class="visually-hidden" type="file" accept="video/*" />
        </label>
      </form>

      <section class="stage">
        <div class="stage__frame">
          <video id="video" class="stage__video" muted playsinline></video>
          <canvas id="overlay" class="stage__overlay"></canvas>
        </div>
        <p id="status" class="status" role="status"></p>
      </section>

      <aside class="panel">
        <dl class="stats">
          <div class="stats__item">
            <dt data-i18n="people">Osoby w kadrze</dt>
            <dd id="people-count" class="stats__value">0</dd>
          </div>
          <div class="stats__item">
            <dt data-i18n="detectionFps">Wykrywanie (kl./s)</dt>
            <dd id="detection-fps" class="stats__value">0</dd>
          </div>
        </dl>
        <label class="field">
          <span class="field__label"
            ><span data-i18n="threshold">Próg pewności</span>: <output id="threshold-value">50%</output></span
          >
          <input id="threshold" type="range" min="10" max="95" step="5" value="50" />
        </label>
        <label class="field">
          <span class="field__label"
            ><span data-i18n="tiling">Podział kadru</span>: <output id="tiling-value">5×3</output></span
          >
          <input id="tiling" type="range" min="1" max="4" step="1" value="3" />
          <span class="field__hint" data-i18n="tilingHint">Więcej kafelków = mniejsze postacie, ale wolniej</span>
        </label>
        <label class="field">
          <span class="field__label"
            ><span data-i18n="lineWidth">Grubość ramki</span>: <output id="line-width-value">1 px</output></span
          >
          <input id="line-width" type="range" min="0.5" max="6" step="0.5" value="1" />
        </label>
        <label class="checkbox">
          <input id="boxes-toggle" type="checkbox" checked />
          <span data-i18n="showBoxes">Pokaż prostokąty</span>
        </label>
      </aside>
    </main>

    <dialog id="shortcuts" class="dialog" aria-labelledby="shortcuts-title">
      <h2 id="shortcuts-title" data-i18n="shortcuts">Skróty klawiaturowe</h2>
      <dl class="shortcuts">
        <dt><kbd>?</kbd></dt>
        <dd data-i18n="keyHelp">Ta ściąga</dd>
        <dt><kbd>Spacja</kbd></dt>
        <dd data-i18n="keyPlay">Pauza / wznowienie</dd>
        <dt><kbd>B</kbd></dt>
        <dd data-i18n="keyBoxes">Pokaż / ukryj prostokąty</dd>
        <dt><kbd>/</kbd></dt>
        <dd data-i18n="keyUrl">Przejdź do pola adresu</dd>
        <dt><kbd>Esc</kbd></dt>
        <dd data-i18n="keyClose">Zamknij ściągę</dd>
      </dl>
      <form method="dialog">
        <button class="button" type="submit" data-i18n="close">Zamknij</button>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
